# psyBNC - configurazione di default per PS Vita
#
# In ascolto su tutte le interfacce (*) alla porta 31337, che e' la
# porta storica di default di psyBNC.
#
# Nessun utente e' ancora configurato: la PRIMA persona che si connette
# a IP_DELLA_VITA:31337 con un client IRC e invia
#
#     /PASS unapasswordatuascelta
#
# diventa automaticamente l'amministratore del bouncer con quella
# password (e' il comportamento nativo di psyBNC, vedi firstuser() in
# src/p_client.c). Da li' in poi puoi usare i comandi admin (es. /BHELP,
# /ADDSERVER, /JUMP) per scegliere a quale rete/server IRC collegarti.
#
# Collegati TU per primo appena avvii il bouncer, prima di far girare
# la Vita su una rete che altri possono raggiungere.
PSYBNC.SYSTEM.PORT1=31337
PSYBNC.SYSTEM.HOST1=*
PSYBNC.SYSTEM.LANGUAGE=italiano
PSYBNC.SYSTEM.ME=psyBNCVita
#
# Senza almeno una regola HOSTALLOWS, psyBNC rifiuta TUTTE le connessioni
# in ingresso (whitelist, non blacklist) - vedi checkhostallows() in
# src/p_peer.c. Questa riga permette la connessione da qualsiasi host.
PSYBNC.HOSTALLOWS.ENTRY0=*;*
